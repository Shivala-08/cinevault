<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CineVault — Your personal dark-themed movie watchlist. Search, discover, and save movies powered by the OMDb API." />
  <title>CineVault — Your Personal Movie Watchlist</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== LOADING SPINNER OVERLAY ========== -->
  <div id="spinner-overlay" class="spinner-overlay hidden" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <!-- ========== MOVIE DETAIL MODAL ========== -->
  <div id="movie-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Close modal">✕</button>
      <div class="modal-content" id="modal-content">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- ========== CONFETTI CANVAS ========== -->
  <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:7999;"></canvas>

  <!-- ========== TOAST NOTIFICATION ========== -->
  <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>

  <!-- ========== NAVBAR ========== -->
  <header class="navbar" id="navbar">
    <div class="navbar-inner">

      <!-- Logo -->
      <div class="navbar-logo" id="logo-btn" role="button" tabindex="0" aria-label="CineVault Home">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">CineVault</span>
      </div>

      <!-- Center Search (desktop) -->
      <div class="navbar-search" id="navbar-search-wrap">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search movies, directors, genres…"
            autocomplete="off"
            aria-label="Search movies"
          />
          <button class="search-clear-btn hidden" id="search-clear-btn" aria-label="Clear search">✕</button>
        </div>
      </div>

      <!-- Nav Tabs -->
      <nav class="navbar-tabs" role="tablist" aria-label="Main Navigation">
        <button class="nav-tab active" id="tab-discover" role="tab" aria-selected="true" aria-controls="discover-screen" data-screen="discover">
          <span class="tab-icon">🔍</span>
          <span class="tab-label">Discover</span>
        </button>
        <button class="nav-tab" id="tab-watchlist" role="tab" aria-selected="false" aria-controls="watchlist-screen" data-screen="watchlist">
          <span class="tab-icon">🎭</span>
          <span class="tab-label">My Watchlist</span>
          <span class="watchlist-badge hidden" id="watchlist-badge">0</span>
        </button>
      </nav>

    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content" id="main-content">

    <!-- ====== DISCOVER SCREEN ====== -->
    <section id="discover-screen" class="screen active" role="tabpanel" aria-labelledby="tab-discover">

      <!-- Mobile Search Bar -->
      <div class="mobile-search-wrap" id="mobile-search-wrap">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="search-input-mobile"
            class="search-input"
            placeholder="Search movies…"
            autocomplete="off"
            aria-label="Search movies"
          />
          <button class="search-clear-btn hidden" id="search-clear-mobile-btn" aria-label="Clear search">✕</button>
        </div>
      </div>

      <!-- Trending Section (default view, hidden during search) -->
      <div id="trending-section" class="trending-section">
        <div class="trending-header">
          <div class="section-title-group">
            <h2 class="section-label">🔥 Trending Now</h2>
            <span class="trending-subtitle">Curated popular picks</span>
          </div>
          <div class="trending-header-right">
            <div id="genre-chips" class="genre-chips" role="group" aria-label="Filter by genre"></div>
            <button class="btn-surprise" id="surprise-btn" aria-label="Surprise me with a random movie">🎲 Surprise Me</button>
          </div>
        </div>
        <div id="trending-sort-bar" class="sort-filter-bar hidden"></div>
        <div id="trending-grid" class="results-container"></div>
      </div>

      <!-- Sort / Filter Bar (shown with search results) -->
      <div id="sort-filter-bar" class="sort-filter-bar hidden" role="toolbar" aria-label="Sort and filter results"></div>

      <!-- Search Results Container -->
      <div id="discover-results" class="results-container hidden"></div>

      <!-- Pagination -->
      <div id="pagination-container" class="pagination-container hidden"></div>

    </section>

    <!-- ====== WATCHLIST SCREEN ====== -->
    <section id="watchlist-screen" class="screen hidden" role="tabpanel" aria-labelledby="tab-watchlist">

      <div class="watchlist-header">
        <div class="section-title-wrap">
          <h1 class="section-heading">My Watchlist</h1>
          <span class="watchlist-count" id="watchlist-count">0 movies</span>
        </div>
        <button class="btn btn-random hidden" id="random-btn" aria-label="Pick a random movie from your watchlist">
          🎲 Random Movie Night
        </button>
      </div>

      <!-- Watchlist Stats -->
      <div id="watchlist-stats" class="watchlist-stats hidden"></div>

      <!-- Watchlist Grid -->
      <div id="watchlist-grid" class="results-container">
        <!-- Cards rendered here by JS -->
      </div>

    </section>

  </main>

  <!-- ========== SCRIPTS ========== -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
